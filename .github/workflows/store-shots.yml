name: Store screenshots

# Runs only on the store-shots branch. Opens the game in a phone-sized browser,
# captures screenshots and commits them to store/raw on this branch.
on:
  push:
    branches: [store-shots]
    paths-ignore: ['store/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core fonts-noto-ui-core >/dev/null || true
      - name: Capture
        run: node .github/scripts/privacy-check.mjs
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add store/raw
          git commit -m "Store screenshots from browser" || exit 0
          git push
