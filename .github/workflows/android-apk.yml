name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install native Capacitor dependencies
        run: >-
          npm install --prefix deps --no-package-lock
          @capacitor/android@8.5.2
          @capacitor/core@8.5.2
          @capacitor/app@8.1.1
          @capacitor/haptics@8.0.2
          @capacitor/status-bar@8.0.3
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Daam-Kingdom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Daam-Kingdom-APK
          path: Daam-Kingdom.apk
          if-no-files-found: error
